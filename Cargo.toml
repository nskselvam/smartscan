[package]
name = "smartscan"
version = "0.1.0"
edition = "2021"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
csv = "1.3"
eframe = "0.31"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"

# Utilities
rand = "0.8"
rand_distr = "0.4"
ndarray = "0.15"
hdf5 = "0.8"
hdf5-sys = { version = "0.8", features = ["static", "zlib"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
